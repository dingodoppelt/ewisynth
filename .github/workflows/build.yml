on:
  workflow_dispatch:
  push:
    tags:
      - "build_*"
      - "r_*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    strategy:
      matrix:
        # HIER ERWEITERT: Fügt arm64 (Raspberry Pi & Co.) zur Build-Matrix hinzu
        target: [linux-x86_64, linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      # Läuft jetzt automatisch zweimal: einmal für x86_64 und einmal für arm64
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: ${{ matrix.target }}

  macos:
    strategy:
      matrix:
        target: [macos-universal]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          brew install fftw pkg-config
          
      - name: Build with DPF (Forced Frameworks)
        run: |
          make MACOS_UNIVERSAL=true \
               LDFLAGS="-framework Accelerate" \
               USER_LDFLAGS="-framework Accelerate"
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
          CPATH: /opt/homebrew/include
          LIBRARY_PATH: /opt/homebrew/lib
          CFLAGS: "-arch arm64 -arch x86_64"
          CXXFLAGS: "-arch arm64 -arch x86_64"

      - name: Zip macOS Binaries
        run: |
          cd bin
          zip -r ../ewisynth-macos-universal.zip ./*
          
      - name: Upload macOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ewisynth-archive-macos
          path: ewisynth-macos-universal.zip
          if-no-files-found: error

  windows-cross:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 pkg-config

      - name: Fix Aubio Cross-Compile Random Bug
        run: |
          if [ -f aubio/tests/utils_tests.h ]; then
            sed -i '1s/^/#define srandom srand\n#define random rand\n/' aubio/tests/utils_tests.h
            echo "Aubio Test-Header erfolgreich für Windows gepatcht!"
          fi

      - uses: distrho/dpf-makefile-action@v1
        with:
          target: win64
        env:
          WAFOPTS: "--notests --disable-docs"
          CROSS_COMPILING: "true"

  release:
    needs: [linux, macos, windows-cross]
    if: startsWith(github.ref, 'refs/tags/r_')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect Packed Archives Only
        run: |
          mkdir ./release_files
          find ./artifacts -type f \( -name "*.zip" -o -name "*.tar.xz" -o -name "*.tar.gz" \) -exec cp {} ./release_files/ \;
          echo "Folgende Archive gelistet für das Release:"
          ls -R ./release_files

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./release_files/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
